name: Deploy to Local

on:
  workflow_run:
    workflows:
      - Python CI
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Stop existing container
        run: |
          docker rm -f python-cicd-demo || true

      - name: Build Docker image
        run: |
          docker build -t python-cicd-demo:${{ github.sha }} .

      - name: Start new container
        run: |
          docker run -d \
            --name python-cicd-demo \
            -p 8000:8000 \
            python-cicd-demo:${{ github.sha }}

      - name: Health check
        run: |
          sleep 5
          curl http://localhost:8000/health
